name: Refresh and deploy market data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: research-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update:all
        env:
          SEC_CONTACT: https://github.com/${{ github.repository }}
          MARKET_CONCURRENCY: 6
          MARKET_REFRESH_MODE: incremental
          MARKET_BASE_URL: https://el.amruthg.com
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:data
      - name: Deploy validated snapshot to Cloudflare
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
