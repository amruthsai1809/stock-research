name: Refresh market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update
        env:
          SEC_CONTACT: https://github.com/${{ github.repository }}
      - run: npm test
      - name: Commit validated snapshot
        run: |
          if git diff --quiet -- public/data/market-data.json; then
            echo "No market-data changes"
            exit 0
          fi
          git config user.name "tide-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-data.json
          git commit -m "chore(data): refresh market snapshot"
          git push
